<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/>
    </marker>
  </defs>
  <text x="450" y="26" font-size="17" font-weight="600" fill="#1A1B1C" text-anchor="middle">Mini-CodeAgent 记忆系统全景 · 长期记忆 / 上下文压缩 / 记忆召回</text>
  <text x="450" y="46" font-size="11" fill="#6B7280" text-anchor="middle">数据流：沉淀（写）→ 存储 → 召回（读）→ 注入。节点均基于代码实现。</text>
  <rect x="16" y="60" width="868" height="84" rx="12" fill="#E9EFFC" stroke="rgba(0,0,0,0.08)"/><text x="30" y="84" font-size="13" font-weight="600" fill="#1A1B1C">① 执行层 · AgentEngine（engine.py 异步主循环）</text>
  <rect x="30" y="90" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="110" font-size="12" font-weight="600" fill="#1A1B1C">用户输入</text><text x="40" y="118" font-size="11" fill="#6B7280">execute_query → session 会话</text>
  <rect x="244" y="90" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="254" y="110" font-size="12" font-weight="600" fill="#1A1B1C">PlanManager</text><text x="254" y="118" font-size="11" fill="#6B7280">计划/步骤追踪/中断恢复</text>
  <rect x="458" y="90" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="468" y="110" font-size="12" font-weight="600" fill="#1A1B1C">工具执行</text><text x="468" y="118" font-size="11" fill="#6B7280">Tool / pytest / Git 自愈</text>
  <rect x="672" y="90" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="682" y="110" font-size="12" font-weight="600" fill="#1A1B1C">final_answer</text><text x="682" y="118" font-size="11" fill="#6B7280">任务完成输出</text>
  <text x="450" y="160" font-size="11" fill="#6B7280" text-anchor="middle">↓ 事件观察（_observe_prompt_submit / _observe_tool_result / _remember_task_completion）　·　↓ 上下文超预算 → 压缩</text>
  <rect x="16" y="178" width="868" height="132" rx="12" fill="#F1EAF9" stroke="rgba(0,0,0,0.08)"/><text x="30" y="202" font-size="13" font-weight="600" fill="#1A1B1C">② 记忆写入 · 沉淀双通道（kind 由事件确定性映射，非 LLM 分类）</text>
  <rect x="30" y="208" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="228" font-size="12" font-weight="600" fill="#1A1B1C">A·事件驱动（实时，importance/conf 硬编码）</text><text x="40" y="236" font-size="11" fill="#6B7280">任务提交 → ❦TASK ❦0.55/0.7</text><text x="40" y="253" font-size="11" fill="#6B7280">工具成功 → ❦WORKFLOW ❦0.6/0.85</text><text x="40" y="270" font-size="11" fill="#6B7280">工具失败/pytest 失败 → ❦BUG ❦0.8/0.85</text><text x="40" y="287" font-size="11" fill="#6B7280">任务完成 → ❦TASK ❦0.75/0.8 + concepts</text>
  <rect x="372" y="208" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="382" y="228" font-size="12" font-weight="600" fill="#1A1B1C">B·压缩驱动（异步提炼，signature 去重）</text><text x="382" y="236" font-size="11" fill="#6B7280">errors → ❦BUG ❦（resolved 0.85 / failed 0.75）</text><text x="382" y="253" font-size="11" fill="#6B7280">key_decisions → ❦DECISION ❦0.72</text><text x="382" y="270" font-size="11" fill="#6B7280">user_preferences → ❦PREFERENCE ❦</text><text x="382" y="287" font-size="11" fill="#6B7280">工作流 → ❦WORKFLOW ❦</text>
  <rect x="714" y="208" width="156" height="88" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="724" y="228" font-size="12" font-weight="600" fill="#1A1B1C">C·主动工具</text><text x="724" y="236" font-size="11" fill="#6B7280">memory_save 工具</text><text x="724" y="253" font-size="11" fill="#6B7280">任意 kind 主动保存</text>
  <text x="450" y="326" font-size="11" fill="#6B7280" text-anchor="middle">↓ MemoryItem / SessionSummary 落库（save_memory_item / save_summary）</text>
  <rect x="16" y="344" width="868" height="148" rx="12" fill="#E7F3FA" stroke="rgba(0,0,0,0.08)"/><text x="30" y="368" font-size="13" font-weight="600" fill="#1A1B1C">③ 记忆存储 · 三层 + 磁盘（memory_layers.py）</text>
  <rect x="30" y="374" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="394" font-size="12" font-weight="600" fill="#1A1B1C">WorkingMemory</text><text x="40" y="402" font-size="11" fill="#6B7280">容量 20</text><text x="40" y="416" font-size="11" fill="#6B7280">实时会话消息</text><text x="40" y="430" font-size="11" fill="#6B7280">超限逐出</text>
  <rect x="244" y="374" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="254" y="394" font-size="12" font-weight="600" fill="#1A1B1C">EpisodicMemory</text><text x="254" y="402" font-size="11" fill="#6B7280">容量 50 摘要</text><text x="254" y="416" font-size="11" fill="#6B7280">满时淘汰 importance</text><text x="254" y="430" font-size="11" fill="#6B7280">最低（同分最旧）</text><text x="254" y="444" font-size="11" fill="#6B7280">→ 归档长期</text>
  <rect x="458" y="374" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="468" y="394" font-size="12" font-weight="600" fill="#1A1B1C">LongTermMemory</text><text x="468" y="402" font-size="11" fill="#6B7280">memory/long_term/</text><text x="468" y="416" font-size="11" fill="#6B7280">memory_item_{id}_{ts}.json</text><text x="468" y="430" font-size="11" fill="#6B7280">同 id 覆盖旧文件</text>
  <rect x="672" y="374" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="682" y="394" font-size="12" font-weight="600" fill="#1A1B1C">持久化索引</text><text x="682" y="402" font-size="11" fill="#6B7280">index.json 倒排</text><text x="682" y="416" font-size="11" fill="#6B7280">（原子写入 + WinError 降级）</text><text x="682" y="430" font-size="11" fill="#6B7280">indexes/bm25.json</text><text x="682" y="444" font-size="11" fill="#6B7280">+ vector.json（Phase2）</text>
  <rect x="30" y="456" width="840" height="24" rx="6" fill="rgba(255,255,255,0.7)"/>
  <text x="40" y="472" font-size="10.5" fill="#6B7280">写入治理 prepare_for_save：低质量 → archive 归档；相似 → merge_duplicate 合并；新版 → supersede 取代旧版（旧条目标记 superseded）</text>
  <text x="450" y="508" font-size="11" fill="#6B7280" text-anchor="middle">↑ 召回读取（hybrid_recall / retrieve_by_file_path / retrieve_by_error_type）　·　↑ 压缩摘要回流</text>
  <rect x="16" y="526" width="868" height="168" rx="12" fill="#E7F7F1" stroke="rgba(0,0,0,0.08)"/><text x="30" y="550" font-size="13" font-weight="600" fill="#1A1B1C">④ 记忆召回 · Hybrid Recall → 注入（memory_retrieval.py + memory_context_builder.py）</text>
  <rect x="30" y="556" width="330" height="124" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="576" font-size="12" font-weight="600" fill="#1A1B1C">三通道召回</text><text x="40" y="584" font-size="11" fill="#6B7280">· ❦BM25：❦k1=1.5 b=0.75，字段加权，</text><text x="40" y="600" font-size="11" fill="#6B7280">  matched_terms 可解释</text><text x="40" y="616" font-size="11" fill="#6B7280">· ❦Vector：❦默认 HashEmbedding 128 维</text><text x="40" y="632" font-size="11" fill="#6B7280">  （离线确定）</text><text x="40" y="648" font-size="11" fill="#6B7280">· ❦Metadata：❦文件 1.2/0.75/0.45 +</text><text x="40" y="664" font-size="11" fill="#6B7280">  错误 1.1/0.55 + 重要×0.35 +</text><text x="40" y="680" font-size="11" fill="#6B7280">  时效 30 天衰减 + 类型 0.35/0.3/0.25</text>
  <rect x="372" y="556" width="240" height="124" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="382" y="576" font-size="12" font-weight="600" fill="#1A1B1C">RRF 融合 + 场景权重</text><text x="382" y="584" font-size="11" fill="#6B7280">fused += ❦w/(K=60+rank)❦</text><text x="382" y="600" font-size="11" fill="#6B7280">默认 0.45/0.30/0.20/0.05</text><text x="382" y="616" font-size="11" fill="#6B7280">文件场景 metadata 0.45</text><text x="382" y="632" font-size="11" fill="#6B7280">错误场景 bm25 0.45</text><text x="382" y="648" font-size="11" fill="#6B7280">架构场景 bm25 0.40</text><text x="382" y="664" font-size="11" fill="#6B7280">（graph 权重预留未实现）</text>
  <rect x="624" y="556" width="246" height="124" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="634" y="576" font-size="12" font-weight="600" fill="#1A1B1C">后处理</text><text x="634" y="584" font-size="11" fill="#6B7280">· kind 意图对齐 +0.002</text><text x="634" y="600" font-size="11" fill="#6B7280">· raw boost 平局打破</text><text x="634" y="616" font-size="11" fill="#6B7280">  0.004 / 0.0015</text><text x="634" y="632" font-size="11" fill="#6B7280">· 任务相关性过滤（Jaccard 0.15）</text><text x="634" y="648" font-size="11" fill="#6B7280">· 任务类型优先级重排</text><text x="634" y="664" font-size="11" fill="#6B7280">· token budget 1500 截断注入</text>
  <rect x="16" y="706" width="868" height="132" rx="12" fill="#FDF0E9" stroke="rgba(0,0,0,0.08)"/><text x="30" y="730" font-size="13" font-weight="600" fill="#1A1B1C">⑤ 上下文压缩 · 三策略自适应（compression_engine.py）</text>
  <rect x="30" y="736" width="260" height="88" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="756" font-size="12" font-weight="600" fill="#1A1B1C">策略选择</text><text x="40" y="764" font-size="11" fill="#6B7280">错误占比 >30% → ❦LLM_SUMMARY❦</text><text x="40" y="781" font-size="11" fill="#6B7280">工具占比 >40% → ❦KEYFRAME❦</text><text x="40" y="798" font-size="11" fill="#6B7280">其他 → ❦SLIDING_WINDOW❦</text><text x="40" y="815" font-size="11" fill="#6B7280">（阈值驱动）</text>
  <rect x="302" y="736" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="312" y="756" font-size="12" font-weight="600" fill="#1A1B1C">LLM_SUMMARY 链路</text><text x="312" y="764" font-size="11" fill="#6B7280">condense 裁工具输出 → 严格 JSON Prompt</text><text x="312" y="781" font-size="11" fill="#6B7280">（7 字段 + few-shot + 评分规则）→ 60s 超时</text><text x="312" y="798" font-size="11" fill="#6B7280">→ parse（必需字段校验+元素级容错）→</text><text x="312" y="815" font-size="11" fill="#6B7280">CompressedSessionState 确定性重建 → 回写</text>
  <rect x="644" y="736" width="226" height="88" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="654" y="756" font-size="12" font-weight="600" fill="#1A1B1C">降级链</text><text x="654" y="764" font-size="11" fill="#6B7280">超时/空返回/频率超限/JSON 坏</text><text x="654" y="781" font-size="11" fill="#6B7280">→ 全部降级 SLIDING_WINDOW</text><text x="654" y="798" font-size="11" fill="#6B7280">不阻塞主流程；状态字段由</text><text x="654" y="815" font-size="11" fill="#6B7280">PlanManager 真实状态覆盖</text>
  <rect x="16" y="854" width="868" height="52" rx="8" fill="rgba(0,0,0,0.025)"/>
  <text x="30" y="874" font-size="10.5" fill="#6B7280">闭环：执行层（①）→ 事件/压缩双通道（②）→ 三层存储（③）→ 召回注入（④）→ 回到执行层；压缩引擎（⑤）贯穿：超预算时压缩消息 → 摘要入 Episodic → 满 50 淘汰归档长期 → 召回时读取。</text>
  <text x="30" y="892" font-size="10.5" fill="#6B7280">类型（TASK/WORKFLOW/DECISION/BUG）为事件确定性映射；graph 通道权重预留未实现；Vector 默认哈希投影。权重/容量/阈值均来自代码实读。</text>
</svg>
