<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="100%" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/>
    </marker>
  </defs>
  <text x="450" y="26" font-size="17" font-weight="600" fill="#1A1B1C" text-anchor="middle">Mini-CodeAgent 记忆系统全景 · 长期记忆 / 上下文压缩 / 记忆召回</text>
  <text x="450" y="46" font-size="11" fill="#6B7280" text-anchor="middle">数据流：沉淀（写）→ 存储 → 召回（读）→ 注入。节点均基于代码实现。</text>
  <rect x="16" y="64" width="868" height="92" rx="12" fill="#E9EFFC" stroke="rgba(0,0,0,0.08)"/><text x="30" y="90" font-size="13" font-weight="600" fill="#1A1B1C">① 执行层 · AgentEngine（engine.py 异步主循环）</text>
  <rect x="30" y="98" width="200" height="46" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="120" font-size="12" font-weight="600" fill="#1A1B1C">用户输入</text><text x="40" y="130" font-size="11" fill="#6B7280">execute_query → session 会话</text>
  <rect x="244" y="98" width="200" height="46" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="254" y="120" font-size="12" font-weight="600" fill="#1A1B1C">PlanManager</text><text x="254" y="130" font-size="11" fill="#6B7280">计划/步骤追踪/中断恢复</text>
  <rect x="458" y="98" width="200" height="46" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="468" y="120" font-size="12" font-weight="600" fill="#1A1B1C">工具执行</text><text x="468" y="130" font-size="11" fill="#6B7280">Tool / pytest / Git 自愈</text>
  <rect x="672" y="98" width="200" height="46" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="682" y="120" font-size="12" font-weight="600" fill="#1A1B1C">final_answer</text><text x="682" y="130" font-size="11" fill="#6B7280">任务完成输出</text>
  <text x="450" y="174" font-size="11" fill="#6B7280" text-anchor="middle">↓ 事件观察（_observe_prompt_submit / _observe_tool_result / _remember_task_completion）　·　↓ 上下文超预算 → 压缩</text>
  <rect x="16" y="196" width="868" height="148" rx="12" fill="#F1EAF9" stroke="rgba(0,0,0,0.08)"/><text x="30" y="222" font-size="13" font-weight="600" fill="#1A1B1C">② 记忆写入 · 沉淀双通道（kind 由事件确定性映射，非 LLM 分类）</text>
  <rect x="30" y="230" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="252" font-size="12" font-weight="600" fill="#1A1B1C">A·事件驱动（实时，importance/conf 硬编码）</text><text x="40" y="262" font-size="11" fill="#6B7280">任务提交 → ❦TASK ❦0.55/0.7</text><text x="40" y="281" font-size="11" fill="#6B7280">工具成功 → ❦WORKFLOW ❦0.6/0.85</text><text x="40" y="300" font-size="11" fill="#6B7280">工具失败/pytest 失败 → ❦BUG ❦0.8/0.85</text><text x="40" y="319" font-size="11" fill="#6B7280">任务完成 → ❦TASK ❦0.75/0.8 + concepts</text>
  <rect x="372" y="230" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="382" y="252" font-size="12" font-weight="600" fill="#1A1B1C">B·压缩驱动（异步提炼，signature 去重）</text><text x="382" y="262" font-size="11" fill="#6B7280">errors → ❦BUG ❦（resolved 0.85 / failed 0.75）</text><text x="382" y="281" font-size="11" fill="#6B7280">key_decisions → ❦DECISION ❦0.72</text><text x="382" y="300" font-size="11" fill="#6B7280">user_preferences → ❦PREFERENCE ❦</text><text x="382" y="319" font-size="11" fill="#6B7280">工作流 → ❦WORKFLOW ❦</text>
  <rect x="714" y="230" width="156" height="100" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="724" y="252" font-size="12" font-weight="600" fill="#1A1B1C">C·主动工具</text><text x="724" y="262" font-size="11" fill="#6B7280">memory_save 工具</text><text x="724" y="281" font-size="11" fill="#6B7280">任意 kind 主动保存</text>
  <text x="450" y="362" font-size="11" fill="#6B7280" text-anchor="middle">↓ MemoryItem / SessionSummary 落库（save_memory_item / save_summary）</text>
  <rect x="16" y="384" width="868" height="164" rx="12" fill="#E7F3FA" stroke="rgba(0,0,0,0.08)"/><text x="30" y="410" font-size="13" font-weight="600" fill="#1A1B1C">③ 记忆存储 · 三层 + 磁盘（memory_layers.py）</text>
  <rect x="30" y="418" width="200" height="82" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="440" font-size="12" font-weight="600" fill="#1A1B1C">WorkingMemory</text><text x="40" y="450" font-size="11" fill="#6B7280">容量 20</text><text x="40" y="467" font-size="11" fill="#6B7280">实时会话消息</text><text x="40" y="484" font-size="11" fill="#6B7280">超限逐出</text>
  <rect x="244" y="418" width="200" height="82" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="254" y="440" font-size="12" font-weight="600" fill="#1A1B1C">EpisodicMemory</text><text x="254" y="450" font-size="11" fill="#6B7280">容量 50 摘要</text><text x="254" y="467" font-size="11" fill="#6B7280">满时淘汰 importance</text><text x="254" y="484" font-size="11" fill="#6B7280">最低（同分最旧）</text><text x="254" y="501" font-size="11" fill="#6B7280">→ 归档长期</text>
  <rect x="458" y="418" width="200" height="82" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="468" y="440" font-size="12" font-weight="600" fill="#1A1B1C">LongTermMemory</text><text x="468" y="450" font-size="11" fill="#6B7280">memory/long_term/</text><text x="468" y="467" font-size="11" fill="#6B7280">memory_item_{id}_{ts}.json</text><text x="468" y="484" font-size="11" fill="#6B7280">同 id 覆盖旧文件</text>
  <rect x="672" y="418" width="200" height="82" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="682" y="440" font-size="12" font-weight="600" fill="#1A1B1C">持久化索引</text><text x="682" y="450" font-size="11" fill="#6B7280">index.json 倒排</text><text x="682" y="467" font-size="11" fill="#6B7280">（原子写 + WinError 降级）</text><text x="682" y="484" font-size="11" fill="#6B7280">indexes/bm25.json</text><text x="682" y="501" font-size="11" fill="#6B7280">+ vector.json</text>
  <rect x="30" y="514" width="840" height="26" rx="6" fill="rgba(255,255,255,0.7)"/>
  <text x="40" y="532" font-size="10.5" fill="#6B7280">写入治理 prepare_for_save：低质量 → archive 归档；相似 → merge_duplicate 合并；新版 → supersede 取代（旧条目标记 superseded）</text>
  <text x="450" y="566" font-size="11" fill="#6B7280" text-anchor="middle">↑ 召回读取（hybrid_recall / retrieve_by_file_path / retrieve_by_error_type）　·　↑ 压缩摘要回流</text>
  <rect x="16" y="588" width="868" height="190" rx="12" fill="#E7F7F1" stroke="rgba(0,0,0,0.08)"/><text x="30" y="614" font-size="13" font-weight="600" fill="#1A1B1C">④ 记忆召回 · Hybrid Recall → 注入（memory_retrieval.py + memory_context_builder.py）</text>
  <rect x="30" y="622" width="330" height="142" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="644" font-size="12" font-weight="600" fill="#1A1B1C">三通道召回</text><text x="40" y="654" font-size="11" fill="#6B7280">· ❦BM25：❦k1=1.5 b=0.75，字段加权，</text><text x="40" y="672" font-size="11" fill="#6B7280">  matched_terms 可解释</text><text x="40" y="690" font-size="11" fill="#6B7280">· ❦Vector：❦默认 HashEmbedding 128 维</text><text x="40" y="708" font-size="11" fill="#6B7280">  （离线确定）</text><text x="40" y="726" font-size="11" fill="#6B7280">· ❦Metadata：❦文件 1.2/0.75/0.45 +</text><text x="40" y="744" font-size="11" fill="#6B7280">  错误 1.1/0.55 + 重要×0.35 + 时效</text>
  <rect x="372" y="622" width="240" height="142" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="382" y="644" font-size="12" font-weight="600" fill="#1A1B1C">RRF 融合 + 场景权重</text><text x="382" y="654" font-size="11" fill="#6B7280">fused += ❦w/(K=60+rank)❦</text><text x="382" y="672" font-size="11" fill="#6B7280">默认 0.45/0.30/0.20/0.05</text><text x="382" y="690" font-size="11" fill="#6B7280">文件场景 metadata 0.45</text><text x="382" y="708" font-size="11" fill="#6B7280">错误场景 bm25 0.45</text><text x="382" y="726" font-size="11" fill="#6B7280">架构场景 bm25 0.40</text><text x="382" y="744" font-size="11" fill="#6B7280">（graph 权重预留未实现）</text>
  <rect x="624" y="622" width="246" height="142" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="634" y="644" font-size="12" font-weight="600" fill="#1A1B1C">后处理</text><text x="634" y="654" font-size="11" fill="#6B7280">· kind 意图对齐 +0.002</text><text x="634" y="672" font-size="11" fill="#6B7280">· raw boost 平局打破 0.004/0.0015</text><text x="634" y="690" font-size="11" fill="#6B7280">· 任务相关性过滤（Jaccard 0.15）</text><text x="634" y="708" font-size="11" fill="#6B7280">· 任务类型优先级重排</text><text x="634" y="726" font-size="11" fill="#6B7280">· token budget 1500 截断注入</text>
  <rect x="16" y="790" width="868" height="148" rx="12" fill="#FDF0E9" stroke="rgba(0,0,0,0.08)"/><text x="30" y="816" font-size="13" font-weight="600" fill="#1A1B1C">⑤ 上下文压缩 · 三策略自适应（compression_engine.py）</text>
  <rect x="30" y="824" width="260" height="100" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="40" y="846" font-size="12" font-weight="600" fill="#1A1B1C">策略选择</text><text x="40" y="856" font-size="11" fill="#6B7280">错误占比 >30% → ❦LLM_SUMMARY❦</text><text x="40" y="875" font-size="11" fill="#6B7280">工具占比 >40% → ❦KEYFRAME❦</text><text x="40" y="894" font-size="11" fill="#6B7280">其他 → ❦SLIDING_WINDOW❦</text><text x="40" y="913" font-size="11" fill="#6B7280">（阈值驱动）</text>
  <rect x="302" y="824" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="312" y="846" font-size="12" font-weight="600" fill="#1A1B1C">LLM_SUMMARY 链路</text><text x="312" y="856" font-size="11" fill="#6B7280">condense 裁工具输出 → 严格 JSON Prompt</text><text x="312" y="875" font-size="11" fill="#6B7280">（7 字段 + few-shot + 评分规则）→ 60s 超时</text><text x="312" y="894" font-size="11" fill="#6B7280">→ parse（必需字段校验+元素级容错）→</text><text x="312" y="913" font-size="11" fill="#6B7280">CompressedSessionState 确定性重建 → 回写</text>
  <rect x="644" y="824" width="226" height="100" rx="8" fill="#FFFFFF" stroke="#E0DFD9"/><text x="654" y="846" font-size="12" font-weight="600" fill="#1A1B1C">降级链</text><text x="654" y="856" font-size="11" fill="#6B7280">超时/空返回/频率超限/JSON 坏</text><text x="654" y="875" font-size="11" fill="#6B7280">→ 全部降级 SLIDING_WINDOW</text><text x="654" y="894" font-size="11" fill="#6B7280">不阻塞主流程；状态字段由</text><text x="654" y="913" font-size="11" fill="#6B7280">PlanManager 真实状态覆盖</text>
  <rect x="16" y="956" width="868" height="58" rx="8" fill="rgba(0,0,0,0.025)"/>
  <text x="30" y="978" font-size="10.5" fill="#6B7280">闭环：执行层（①）→ 事件/压缩双通道（②）→ 三层存储（③）→ 召回注入（④）→ 回到执行层；压缩引擎（⑤）贯穿：超预算时压缩消息 → 摘要入 Episodic → 满 50 淘汰归档长期 → 召回时读取。</text>
  <text x="30" y="998" font-size="10.5" fill="#6B7280">类型（TASK/WORKFLOW/DECISION/BUG）为事件确定性映射；graph 通道权重预留未实现；Vector 默认哈希投影。权重/容量/阈值均来自代码实读。</text>
</svg>
